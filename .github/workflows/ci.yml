name: build

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libluajit-5.1-dev libuv1-dev libsystemd-dev libyaml-dev \
            libx11-dev libxi-dev libudev-dev libgtest-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
